name: build-manifest
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# إعطاء التصريح الكامل للكتابة
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: تجهيز بيئة بايثون
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          
      - name: تثبيت المكتبات المطلوبة
        run: pip install requests
        
      - name: تشغيل كود استخراج الروابط
        run: python build_manifest.py
        
      - name: رفع الخريطة الجديدة إلى المستودع
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "update manifest"
          git push
