name: build-manifest
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# هذه هي البطاقة التي تسمح للموظف بالكتابة داخل المستودع
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      - run: pip install requests && python build_manifest.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add manifest.json
          git commit -m "update manifest" || exit 0
          git push
